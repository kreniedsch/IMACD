const TESS_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
const PDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDF_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const loaded = {};
function loadScript(src){
  return loaded[src] ||= new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.onload = res;
    s.onerror = () => { delete loaded[src]; rej(new Error('Bibliothek konnte nicht geladen werden (Internet?)')); };
    document.head.appendChild(s);
  });
}
function errMsg(e){
  if(!e) return 'Unbekannter Fehler';
  if(typeof e === 'string') return e;
  if(e.message) return e.message;
  if(e.type === 'error') return 'Datei konnte nicht geladen werden';
  try{ return JSON.stringify(e).slice(0,120); }catch(x){ return String(e); }
}
const inPreview = (() => { try{ return window.self !== window.top || location.protocol === 'file:'; }catch(e){ return true; } })();
let worker = null, workerLang = null;
async function getWorker(){
  const lang = state.settings.ocrLang;
  if(worker && workerLang === lang) return worker;
  if(worker){ try{ await worker.terminate(); }catch(e){} worker = null; }
  await loadScript(TESS_URL);
  setProg('Lade Texterkennung (beim ersten Mal etwas länger) …', 0.05);
  try{
    worker = await Tesseract.createWorker(lang, 1, {
      logger: m => { if(m.status === 'recognizing text') setProg(progLabel+' – Text wird erkannt …', m.progress); }
    });
  }catch(e){
    worker = null;
    throw new Error('Texterkennung konnte nicht geladen werden. Öffne die App in Safari über GitHub Pages und prüfe die Internetverbindung.');
  }
  await worker.setParameters({ preserve_interword_spaces:'1' });
  workerLang = lang;
  return worker;
}
async function prepImage(src){
  let bmp;
  try{ bmp = src instanceof HTMLCanvasElement ? src : await createImageBitmap(src, { imageOrientation:'from-image' }); }
  catch(e){ return src; }
  const max = 2400, sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width*sc); c.height = Math.round(bmp.height*sc);
  const g = c.getContext('2d', { willReadFrequently:true }); g.drawImage(bmp, 0, 0, c.width, c.height);
  const img = g.getImageData(0, 0, c.width, c.height), d = img.data;
  let lo = 255, hi = 0; const gray = new Uint8ClampedArray(d.length/4);
  for(let i=0,j=0;i<d.length;i+=4,j++){ const v = 0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]; gray[j] = v; if(v<lo) lo=v; if(v>hi) hi=v; }
  const span = Math.max(1, hi-lo);
  for(let i=0,j=0;i<d.length;i+=4,j++){ const v = (gray[j]-lo)*255/span; d[i]=d[i+1]=d[i+2]=v; }
  g.putImageData(img, 0, 0);
  return c;
}
async function ocr(src){
  const w = await getWorker();
  const img = await prepImage(src);
  let data;
  try{ ({ data } = await w.recognize(img, { rotateAuto:true })); }
  catch(e){ ({ data } = await w.recognize(img)); }
  return data.text || '';
}
async function pdfText(file){
  await loadScript(PDF_URL);
  pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER;
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  let out = '';
  for(let p=1; p<=pdf.numPages; p++){
    setProg(`${progLabel} – Seite ${p}/${pdf.numPages}`, p/pdf.numPages);
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    let txt = tc.items.map(i => i.str + (i.hasEOL ? '\n' : ' ')).join('');
    if(txt.replace(/\s/g,'').length < 30){
      const vp = page.getViewport({ scale:2 });
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
      await page.render({ canvasContext:c.getContext('2d'), viewport:vp }).promise;
      txt = await ocr(c);
    }
    out += txt + '\n\n';
  }
  return out;
}
let progLabel = '';
function setProg(text, p){ $('#progWrap').hidden = false; $('#progText').textContent = text; $('#progBar').style.width = Math.round((p||0)*100)+'%'; }
function endProg(){ $('#progWrap').hidden = true; $('#progBar').style.width = '0'; }

let lastSkipped = 0;
function addCandidates(blocks, date){
  let n = 0;
  for(const b of blocks){
    if(b.replace(/\s/g,'').length < 15) continue;
    if(!isForMe(b, state.settings.tech)){ lastSkipped++; continue; }
    state.pending.push(parseBlock(b, date)); n++;
  }
  save(); renderScan();
  return n;
}
function foundMsg(n){
  const sk = lastSkipped; lastSkipped = 0;
  const other = sk ? ` · ${sk} von anderen Technikern ausgelassen` : '';
  return n ? `${n} Ticket${n===1?'':'s'} erkannt – bitte prüfen${other}` : `Nichts für dich erkannt${other}`;
}
let busy = false;
async function handleFiles(fileList){
  const files = [...fileList]; if(!files.length || busy) return;
  busy = true;
  const date = $('#scanDate').value || view.date;
  const mode = $('#photoMode').value;
  const merged = []; let n = 0;
  try{
    for(let i=0;i<files.length;i++){
      const f = files[i];
      progLabel = files.length > 1 ? `Datei ${i+1}/${files.length}` : 'Datei';
      setProg(progLabel+' …', 0);
      if(aiReady() && !/\.ics$/i.test(f.name) && f.type !== 'text/calendar'){
        try{
          setProg(progLabel+' – KI liest das Ticket …', 0.5);
          n += addAiTickets(await aiExtract(f), date);
          continue;
        }catch(err){ console.error(err); toast('KI: '+errMsg(err)+' – lokale Erkennung wird verwendet'); await new Promise(r => setTimeout(r, 1200)); }
      }
      if(f.type === 'text/calendar' || /\.ics$/i.test(f.name)){
        n += addCandidates(icsToBlocks(await f.text()), date);
      } else if(f.type === 'application/pdf' || /\.pdf$/i.test(f.name)){
        n += addCandidates(textToBlocks(await pdfText(f)), date);
      } else {
        const tx = await ocr(f);
        if(mode === 'one' && files.length >= 1) n += addCandidates([tx], date);
        else merged.push(tx);
      }
    }
    if(merged.length) n += addCandidates(splitBlocks(merged.join('\n\n')), date);
    toast(n || lastSkipped ? foundMsg(n) : 'Kein Text erkannt. Foto gerader und heller aufnehmen.');
  }catch(e){ console.error(e); toast(errMsg(e)); }
  finally{ busy = false; endProg(); }
}

async function deliver(name, content, mime, preferShare){
  const blob = new Blob([content], { type:mime });
  if(preferShare){
    try{
      const file = new File([blob], name, { type:mime });
      if(navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:name }); return true; }
    }catch(e){ if(e.name === 'AbortError') return false; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
  return true;
}
async function backup(){
  const { aiKey, gemKey, ...safeSettings } = state.settings;
  const data = { app:'einsatzplan', version:1, exported:new Date().toISOString(), settings:safeSettings, tickets:state.tickets, pending:state.pending };
  const ok = await deliver(`imacd-backup-${iso(new Date())}.json`, JSON.stringify(data, null, 1), 'application/json', true);
  if(ok){ state.lastBackup = new Date().toISOString(); save(); renderAll(); toast('Backup erstellt'); }
}
async function importBackup(file){
  try{
    const d = JSON.parse(await file.text());
    if(!d || !Array.isArray(d.tickets)) throw new Error('Keine gültige Backup-Datei');
    const byId = new Map(state.tickets.map(t => [t.id, t]));
    d.tickets.forEach(t => byId.set(t.id, t));
    state.tickets = [...byId.values()];
    if(Array.isArray(d.pending)){ const ids = new Set(state.pending.map(p=>p.id)); d.pending.forEach(p => { if(!ids.has(p.id)) state.pending.push(p); }); }
    if(d.settings) state.settings = { ...DEFAULTS, ...d.settings, aiKey: state.settings.aiKey, gemKey: state.settings.gemKey };
    save(); renderAll(); toast(`${d.tickets.length} Tickets importiert`);
  }catch(e){ toast('Import fehlgeschlagen: '+e.message); }
}

function copyDay(){

    if(t.shelf || t.newDevice || t.orderId) lines.push('   '+[t.shelf && 'Regal '+t.shelf, t.newDevice, t.orderId && 'Auftrag '+t.orderId].filter(Boolean).join(' · '));

  P.overflow.forEach(t => lines.push(`–  nicht eingeplant ${t.ticket||''} ${t.title||''}`));
  copyText(lines.join('\n'), 'Tagesplan kopiert');
}
function copyText(s, msg){
  (navigator.clipboard ? navigator.clipboard.writeText(s) : Promise.reject())
    .then(() => toast(msg || 'Kopiert'))
    .catch(() => { const ta = document.createElement('textarea'); ta.value = s; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast(msg||'Kopiert'); }catch(e){} ta.remove(); });
}

document.addEventListener('click', e => {
  if(e.target.closest('a[href]')) return;
  const tb = e.target.closest('nav.tabs [data-tab]'); if(tb){ setTab(tb.dataset.tab); return; }
  if(e.target.id === 'sheetWrap'){ closeSheet(); return; }

  switch(b.dataset.act){
    case 'pickDay': view.date = b.dataset.d; renderPlan(); break;
    case 'weekPrev': view.date = addDays(view.date,-7); renderPlan(); break;
    case 'weekNext': view.date = addDays(view.date,7); renderPlan(); break;
    case 'goToday': view.date = iso(new Date()); renderPlan(); break;
    case 'goScan': setTab('scan'); break;
    case 'detail': openDetail(id); break;
    case 'backDetail': openDetail(id); break;
    case 'done': toggleDone(id); break;
    case 'copy': copyText(b.dataset.v, 'Ticketnummer kopiert'); break;
    case 'edit': { const t = state.tickets.find(x => x.id === id); if(t) openEdit(t,'stored'); break; }
    case 'editPending': { const t = state.pending.find(x => x.id === id); if(t) openEdit(t,'pending'); break; }
    case 'newTicket': openEdit({ id:uid(), ticket:'', kind:'', title:'', date:view.date, start:'', end:'', flex:false, dur:null, address:'', room:'', contact:'', phone:'', email:'', notes:'', devices:'', shelf:'', orderId:'', newDevice:'', oldDevice:'', material:'', free:false, raw:'', done:false }, 'new'); break;
    case 'deleteTicket':
      if(confirm('Ticket löschen?')){ state.tickets = state.tickets.filter(x => x.id !== id); save(); closeSheet(); renderAll(); }
      break;
    case 'accept': acceptOne(id); save(); renderAll(); toast('Übernommen'); break;
    case 'acceptAll': {
      const n = state.pending.length, first = state.pending[0] && state.pending[0].date;
      [...state.pending].forEach(p => acceptOne(p.id)); save();
      if(first) view.date = first;
      setTab('plan'); toast(`${n} ${n===1?'Ticket':'Tickets'} übernommen`); break;
    }
    case 'discard': state.pending = state.pending.filter(x => x.id !== id); save(); renderAll(); break;
    case 'tech':
      state.settings.tech = b.dataset.v; save(); renderScan();
      toast(b.dataset.v ? `Nur Tickets für Techniker ${b.dataset.v}` : 'Alle Tickets werden übernommen'); break;
    case 'aiProv': state.settings.aiProvider = b.dataset.v; save(); renderData(); renderScan(); break;
    case 'pmode': $('#photoMode').value = b.dataset.v; renderScan(); break;
    case 'openPaste': openPaste(); break;
    case 'pasteClip':
      (navigator.clipboard && navigator.clipboard.readText ? navigator.clipboard.readText() : Promise.reject())
        .then(t => { $('#mailText').value = t; }).catch(() => toast('Bitte lange tippen und «Einsetzen» wählen'));
      break;
    case 'parseMail': {
      const tx = $('#mailText').value;
      if(!tx.trim()){ toast('Bitte zuerst Text einfügen'); break; }
      const date = $('#scanDate').value || view.date;
      closeSheet();
      (async () => {
        let n = 0;
        if(aiReady() && !/BEGIN:VEVENT/i.test(tx)){
          try{ setProg('KI liest den Text …', 0.5); n = addAiTickets(await aiExtract(tx), date); }
          catch(err){ toast('KI: '+errMsg(err)+' – lokale Erkennung wird verwendet'); n = addCandidates(textToBlocks(tx), date); }
          finally{ endProg(); }
        } else n = addCandidates(textToBlocks(tx), date);
        toast(foundMsg(n));
        if(n) setTimeout(() => $('#pendingList').scrollIntoView({ behavior:'smooth', block:'start' }), 350);
      })();
      break;
    }
    case 'closeSheet': closeSheet(); break;
    case 'saveEdit': saveEdit(); break;
    case 'deleteEdit': deleteEdit(); break;
    case 'backup': backup(); break;
    case 'ics': exportIcs(); break;
    case 'copyDay': copyDay(); break;
    case 'clearOld': {
      const lim = addDays(iso(new Date()), -30), before = state.tickets.length;
      state.tickets = state.tickets.filter(t => !(t.done && t.date < lim)); save(); renderAll(); renderData();
      toast(`${before - state.tickets.length} gelöscht`); break;
    }
    case 'clearDay':
      if(confirm(`Alle Tickets vom ${longDate(view.date)} löschen?`)){ state.tickets = state.tickets.filter(t => t.date !== view.date); save(); renderAll(); renderData(); }
      break;
    case 'clearAll':
      if(confirm('Wirklich alle Daten löschen? Mach vorher ein Backup.')){ state.tickets = []; state.pending = []; save(); renderAll(); renderData(); }
      break;
  }
});

document.addEventListener('change', e => {
  const id = e.target.id;
  if(id === 'inCam' || id === 'inFiles'){
    const p = handleFiles(e.target.files); e.target.value = '';
    p && p.then(() => { if(state.pending.length) $('#pendingList').scrollIntoView({ behavior:'smooth', block:'start' }); });
    return;
  }
  if(id === 'inImport' && e.target.files[0]){ importBackup(e.target.files[0]); e.target.value = ''; return; }
  if(id === 'dayInput' && e.target.value){ view.date = e.target.value; renderPlan(); return; }
  const k = e.target.dataset && e.target.dataset.set;
  if(k === 'nav'){ state.settings.nav = e.target.value; save(); renderPlan(); toast('Gespeichert'); return; }
  if(k === 'aiOn' || k === 'aiKey' || k === 'aiModel' || k === 'gemKey' || k === 'gemModel'){
    state.settings[k] = k === 'aiOn' ? e.target.checked : e.target.value.trim();
    save(); renderScan();
    if(k === 'aiOn' && e.target.checked && !aiReady()) toast('Bitte noch den API-Key eintragen');
    else toast(k === 'aiOn' ? (e.target.checked ? 'KI-Erkennung aktiviert' : 'KI-Erkennung aus') : 'Gespeichert');
    return;
  }
  if(k){
    let v = e.target.value;
    if(k === 'dur') v = Math.max(5, +v || DEFAULTS.dur);
    else if(k === 'travel') v = Math.max(0, +v || 0);
    else v = v || DEFAULTS[k];
    state.settings[k] = v; save(); renderPlan(); toast('Gespeichert');
  }
});

/* Woche wischen */
(function(){
  const w = $('#week'); let x0 = null, y0 = null;
  w.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive:true });
  w.addEventListener('touchend', e => {
    if(x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){ view.date = addDays(view.date, dx < 0 ? 7 : -7); renderPlan(); }
    x0 = null;
  });
})();

/* Sheet nach unten wischen zum Schliessen */
(function(){
  const sh = $('#sheet'); let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => {
    if(sh.scrollTop > 0 || e.target.closest('input,textarea,select')){ y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0;
  }, { passive:true });
  sh.addEventListener('touchmove', e => {
    if(y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if(dy > 0){ sh.style.transition = 'none'; sh.style.transform = `translateY(${dy}px)`; }
  }, { passive:true });
  sh.addEventListener('touchend', () => {
    if(y0 == null) return;
    sh.style.transition = ''; sh.style.transform = '';
    if(dy > 110) closeSheet();
    y0 = null; dy = 0;
  });
})();

setInterval(() => { if(view.tab === 'plan') renderPlan(); }, 60000);
document.addEventListener('visibilitychange', () => { if(!document.hidden && view.tab === 'plan') renderPlan(); });


document.querySelectorAll('[data-icon]').forEach(el => el.innerHTML = ICON[el.dataset.icon] || '');
$('#scanDate').value = view.date;
renderAll();
</script>
