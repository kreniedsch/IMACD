<style>
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--fill:rgba(118,118,128,.12);--segon:#FFFFFF;
  --label:#000000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.28);--sep:rgba(60,60,67,.22);
  --blue:#007AFF;--orange:#FF9500;--green:#34C759;--red:#FF3B30;--teal:#30B0C7;--indigo:#5856D6;--yellow:#FFCC00;
  --bar:rgba(249,249,249,.84);--shadow:0 1px 2px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000;--card:#1C1C1E;--fill:rgba(118,118,128,.24);--segon:#636366;
    --label:#FFFFFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.28);--sep:rgba(84,84,88,.6);
    --blue:#0A84FF;--orange:#FF9F0A;--green:#30D158;--red:#FF453A;--teal:#40C8E0;--indigo:#5E5CE6;--yellow:#FFD60A;
    --bar:rgba(22,22,24,.84);--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#000000;--card:#1C1C1E;--fill:rgba(118,118,128,.24);--segon:#636366;
  --label:#FFFFFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.28);--sep:rgba(84,84,88,.6);
  --blue:#0A84FF;--orange:#FF9F0A;--green:#30D158;--red:#FF453A;--teal:#40C8E0;--indigo:#5E5CE6;--yellow:#FFD60A;
  --bar:rgba(22,22,24,.84);--shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--label);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:var(--blue);text-decoration:none}
svg{display:block}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 24px}

/* Grosser Titel */
.lt{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 12px}
.lt-l{min-width:0}
.lt-r{display:flex;gap:8px;align-items:center;padding-bottom:4px}
.eyebrow{position:relative;display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.02em}
.eyebrow .ei svg{width:13px;height:13px}
.date-overlay{position:absolute;inset:-6px;opacity:0;width:calc(100% + 12px);height:calc(100% + 12px);-webkit-appearance:none}
h1{font-size:34px;font-weight:700;letter-spacing:.005em;margin:2px 0 0;line-height:1.12}
.circle{width:34px;height:34px;border-radius:50%;border:0;background:var(--fill);color:var(--blue);display:grid;place-items:center;padding:0}
.circle svg{width:18px;height:18px}
.pillbtn{border:0;background:var(--fill);color:var(--blue);border-radius:999px;padding:6px 13px;font-size:15px;font-weight:600}

/* Wochenleiste */
.week{display:flex;align-items:center;margin:0 -8px 16px;touch-action:pan-y}
.wk-nav{border:0;background:none;color:var(--blue);width:26px;height:44px;padding:0;display:grid;place-items:center;flex:none}
.wk-nav svg{width:16px;height:16px}
.wk-days{flex:1;display:grid;grid-template-columns:repeat(7,1fr)}
.wd{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0;color:var(--label)}
.wdn{font-size:11px;font-weight:600;color:var(--label2);text-transform:uppercase}
.wdd{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:500;font-variant-numeric:tabular-nums;transition:background .15s}
.wd.today .wdd{color:var(--red);font-weight:600}
.wd.sel .wdd{background:var(--label);color:var(--bg);font-weight:600}
.wd.sel.today .wdd{background:var(--red);color:#fff}
.wdot{width:5px;height:5px;border-radius:50%}
.wdot.fix{background:var(--orange)}.wdot.flex{background:var(--teal)}

/* Gruppen (iOS-Listen) */
.glabel{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;margin:24px 16px 7px}
.glabel .txtbtn{text-transform:none;font-size:15px;letter-spacing:-.01em}
.gfoot{font-size:13px;color:var(--label2);margin:7px 16px 0;line-height:1.4}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 16px;position:relative;color:var(--label)}
.group>.row+.row::before,.group>label.row+.row::before,.group>.row+label.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.group>.row.ic+.row.ic::before{left:58px}
.row .k{flex:1;min-width:0}
.row .v{color:var(--label2);text-align:right;min-width:0}
.k.blue{color:var(--blue)}.k.red{color:var(--red)}
.tap{cursor:pointer;transition:background .15s}
.tap:active{background:var(--fill)}
.sq{width:30px;height:30px;border-radius:8px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.sq svg{width:18px;height:18px}
.chev{color:var(--label3);flex:none;display:grid;place-items:center}
.chev svg{width:14px;height:14px}
.row.stack{flex-direction:column;align-items:stretch;gap:1px;padding:9px 16px}
.row.stack .k{font-size:13px;color:var(--label2);flex:none}
.row.stack .v{text-align:left;color:var(--label);font-size:17px;word-break:break-word}

/* Formulare */
.form .row .k{flex:none;width:118px;color:var(--label)}
.form .row .k.grow{flex:1;width:auto}
.form input:not(.switch),.form select{flex:1;min-width:0;border:0;background:none;text-align:right;font-size:17px;color:var(--label);padding:0;outline:none;min-height:24px;-webkit-appearance:none;appearance:none}
.form input::placeholder{color:var(--label3)}
.form input::-webkit-date-and-time-value{text-align:right}
.form select{color:var(--label2);text-align-last:right;direction:ltr}
.switch{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;transition:background .2s;flex:none;margin:0;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .22s cubic-bezier(.3,.7,.3,1)}
.switch:checked{background:var(--green)}
.switch:checked::after{transform:translateX(20px)}
textarea.notes{width:100%;border:0;background:var(--card);padding:12px 16px;font-size:17px;min-height:96px;outline:none;resize:vertical;color:var(--label);display:block}
textarea.notes::placeholder{color:var(--label3)}

/* Segment-Steuerung */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:7px 0;font-size:13px;font-weight:500;color:var(--label);transition:background .15s}
.seg button.on{background:var(--segon);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
.seg.sm{width:180px;flex:none}

/* Karten & Buttons */
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.btn-fill{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--blue);color:#fff;border-radius:14px;min-height:50px;padding:0 22px;font-size:17px;font-weight:600;white-space:nowrap}
.btn-tint{--c:var(--blue);display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);border-radius:12px;min-height:46px;padding:0 14px;font-size:16px;font-weight:600}
.btn-tint svg{width:18px;height:18px}
.btn-tint.dis,.btn-tint:disabled{--c:var(--label3)}
.btn-fill:active,.btn-tint:active{opacity:.7}
.txtbtn{border:0;background:none;color:var(--blue);font-size:17px;padding:6px 0;text-align:left}
.txtbtn.bold{font-weight:600}

/* Übersicht */
.sum-row{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.sum-n{display:block;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.sum-l{font-size:12px;color:var(--label2);font-weight:500}
.pbar{height:6px;border-radius:3px;background:var(--fill);margin-top:12px;overflow:hidden}
.pbar>div{height:100%;width:0;background:var(--green);border-radius:3px;transition:width .3s}

/* Nächster Fixtermin */
.hero{position:relative;background:var(--card);border-radius:20px;padding:16px 16px 16px 20px;margin-bottom:12px;overflow:hidden;cursor:pointer}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--orange)}
.hl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--orange);text-transform:uppercase;letter-spacing:.03em}
.cdpill{background:color-mix(in srgb,var(--orange) 15%,transparent);border-radius:999px;padding:2px 9px;text-transform:none;letter-spacing:0}
.ht{font-size:42px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
.ht small{font-size:22px;color:var(--label2);font-weight:600}
.htitle{font-size:17px;font-weight:600;margin-top:4px}
.hs{font-size:14px;color:var(--label2);font-variant-numeric:tabular-nums}
.hacts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.allok{display:flex;align-items:center;gap:12px;font-weight:600}
.allok .sq{border-radius:50%}

/* Fixtermin-Liste */
.fxt{width:48px;flex:none;font-weight:700;color:var(--orange);font-variant-numeric:tabular-nums}
.fx1{font-weight:600;font-size:16px}
.fx2{font-size:13px;color:var(--label2)}
.row.done .fx1{text-decoration:line-through;color:var(--label2)}
.row.done .fxt{color:var(--label2)}
.callbtn{width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green);display:grid;place-items:center;flex:none}
.callbtn svg{width:16px;height:16px}

/* Zeitachse */
.tl-row{display:flex;gap:10px;margin-bottom:8px}
.tl-time{width:44px;flex:none;text-align:right;padding-top:13px;font-variant-numeric:tabular-nums}
.tl-time b{display:block;font-size:15px;font-weight:600}
.tl-time span{font-size:12px;color:var(--label2)}
.tl-card{--c:var(--teal);flex:1;min-width:0;background:var(--card);border-radius:14px;padding:12px 10px 12px 12px;display:flex;gap:11px;align-items:flex-start;cursor:pointer;transition:transform .12s ease}
.tl-card.fix{--c:var(--orange)}
.tl-card:active{transform:scale(.98)}
.tl-card.now{box-shadow:0 0 0 2px var(--blue)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--c);background:none;flex:none;display:grid;place-items:center;color:transparent;margin-top:1px;padding:0;transition:background .15s}
.chk svg{width:14px;height:14px}
.chk.on{background:var(--c);color:#fff}
.tl-body{flex:1;min-width:0}
.tl-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{--c:var(--label2);font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.pill.orange{--c:var(--orange)}.pill.teal{--c:var(--teal)}.pill.green{--c:var(--green)}.pill.blue{--c:var(--blue)}
.tno{font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums}
.tl-title{font-weight:600;font-size:16px;margin-top:4px;line-height:1.3}
.tl-sub{display:flex;gap:6px;align-items:flex-start;font-size:14px;color:var(--label2);margin-top:4px}
.tl-sub svg{width:14px;height:14px;flex:none;margin-top:2px}
.tl-warn{font-size:13px;color:var(--red);font-weight:600;margin-top:5px}
.tl-row.done .tl-title{text-decoration:line-through;color:var(--label2)}
.tl-row.done .tl-card{opacity:.65}
.tl-card .chev{align-self:center}
.tl-gap{display:flex;align-items:center;gap:6px;margin:-2px 0 8px 58px;font-size:13px;color:var(--label2)}
.tl-gap svg{width:14px;height:14px}

/* Logo */
.brandcard{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;padding:14px;margin:6px 0 4px}
.brandcard img{width:60px;height:60px;border-radius:14px;flex:none}
.brandcard b{font-size:20px;display:block}
.brandcard small{color:var(--label2);font-size:14px}
.elogo{width:84px;height:84px;border-radius:20px;display:block;margin:0 auto 16px;box-shadow:0 6px 20px rgba(0,60,180,.25)}
/* Leerer Zustand */
.empty{text-align:center;padding:44px 24px}
.eico{width:76px;height:76px;border-radius:22px;background:var(--fill);color:var(--label2);display:grid;place-items:center;margin:0 auto 16px}
.eico svg{width:36px;height:36px}
.empty h3{font-size:20px;margin:0 0 6px}
.empty p{color:var(--label2);margin:0 0 20px;font-size:15px}

/* Erfassen */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.tile{position:relative;background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:118px;border:0;text-align:left;color:var(--label);cursor:pointer;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile.wide{grid-column:span 2;flex-direction:row;align-items:center;min-height:0}
.tile .ico{width:40px;height:40px;border-radius:11px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.tile .ico svg{width:22px;height:22px}
.tile b{font-size:16px;font-weight:600}
.tile small{display:block;font-size:13px;color:var(--label2);margin-top:1px}
.tile input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.prog{display:flex;gap:14px;align-items:center;margin-top:16px}
.prog #progText{font-size:15px}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--fill);border-top-color:var(--blue);animation:sp .8s linear infinite;flex:none}
.prog .pbar>div{background:var(--blue)}
@keyframes sp{to{transform:rotate(360deg)}}
.pcard{--c:var(--teal);background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
.pcard.fix{--c:var(--orange)}
.pc-head{display:flex;align-items:center;gap:6px}
.pc-when{margin-left:auto;font-size:13px;font-weight:600;color:var(--c);font-variant-numeric:tabular-nums}
.pc-note{font-size:13px;color:var(--label2);margin-top:6px}
.pc-acts{display:flex;gap:8px;margin-top:12px}
.pc-acts .btn-fill{flex:1;min-height:42px;border-radius:11px;font-size:15px;padding:0 12px}
.pc-acts .btn-tint{min-height:42px;border-radius:11px;font-size:15px}
.warn{display:flex;gap:8px;align-items:flex-start;background:color-mix(in srgb,var(--yellow) 18%,transparent);color:var(--label);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0 0}
.warn svg{width:16px;height:16px;color:var(--orange);flex:none;margin-top:1px}

/* Bottom-Sheet */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0);transition:background .3s}
.overlay.open{background:rgba(0,0,0,.35)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:680px;max-height:calc(100% - env(safe-area-inset-top) - 18px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg);border-radius:14px 14px 0 0;padding:0 16px calc(28px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .34s cubic-bezier(.2,.85,.25,1)}
.overlay.open .sheet{transform:none}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:6px auto 0}
.sh-nav{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 0 6px;background:var(--bg)}
.sh-nav>:last-child{text-align:right;justify-self:end}
.sh-title{font-weight:600;font-size:17px}
.det{--c:var(--teal);padding:4px 0 0}
.det h2{font-size:26px;font-weight:700;margin:8px 0 3px;letter-spacing:-.01em;line-height:1.2}
.det .when{font-size:15px;font-weight:600;color:var(--c)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.qa-b{background:var(--card);border:0;border-radius:12px;padding:11px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--blue);font-size:12px;font-weight:500;text-align:center}
.qa-b svg{width:22px;height:22px}
.qa-b.dis{color:var(--label3)}
.qa-b.green{color:var(--green)}
.qa-b:active{opacity:.6}
details.raw{margin-top:18px}
details.raw summary{font-size:13px;color:var(--label2);padding:0 16px;cursor:pointer}
details.raw pre{white-space:pre-wrap;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--card);padding:12px;border-radius:12px;max-height:260px;overflow:auto;margin:8px 0 0}

/* Tab-Leiste */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:7px 0 calc(env(safe-area-inset-bottom) + 4px)}
nav.tabs button{flex:1;max-width:150px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:#8E8E93;position:relative;padding:0}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button.on{color:var(--blue)}
.tdot{position:absolute;top:-3px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:12px;font-weight:600;border-radius:9px;min-width:18px;height:18px;line-height:18px;padding:0 5px;text-align:center}

/* Hinweis-Toast */
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translate(-50%,-24px);opacity:0;transition:opacity .25s,transform .3s cubic-bezier(.2,.85,.25,1);background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:var(--label);padding:11px 18px;border-radius:18px;font-size:15px;font-weight:500;line-height:1.3;box-shadow:0 8px 30px rgba(0,0,0,.16);z-index:70;width:max-content;max-width:min(340px,92vw);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<main>
  <section id="tab-plan">
    <div class="lt">
      <div class="lt-l">
        <div class="eyebrow"><span id="planEyebrow"></span><span class="ei" data-icon="chevd"></span><input type="date" id="dayInput" class="date-overlay" aria-label="Datum wählen"></div>

    </div>

  <section id="tab-scan" hidden>
    <div class="lt"><div class="lt-l"><div class="eyebrow">IMACD</div><h1>Erfassen</h1></div></div>
    <div class="warn" id="previewWarn" hidden style="margin:0 0 4px"><span data-icon="warn"></span><div><b>Vorschau-Modus</b><br>Kamera-Erkennung und KI funktionieren nur, wenn die App in Safari über GitHub Pages geöffnet ist. «Text einfügen» klappt auch hier.</div></div>
    <div class="glabel" style="margin-top:6px">Ich bin</div>

      <button class="tile wide" style="--c:var(--green)" data-act="openPaste"><span class="ico" data-icon="text"></span><div style="flex:1"><b>Text einfügen</b><small>Mail oder Kalendereinträge aus Outlook</small></div><span class="chev" data-icon="chev"></span></button>
    </div>

      <div class="row"><span class="k grow">Mehrere Fotos</span><div class="seg sm" id="pmSeg"></div><input type="hidden" id="photoMode" value="one"></div>

    <div class="card prog" id="progWrap" hidden><div class="spin"></div><div style="flex:1;min-width:0"><div id="progText">…</div><div class="pbar"><div id="progBar"></div></div></div></div>
    <div id="pendingList"></div>

  <section id="tab-data" hidden></section>
</main>

<nav class="tabs">
  <button data-tab="plan" class="on"><span data-icon="calendar"></span>Tagesplan</button>

<script>
/* ===================== PARSER (Texterkennung → Ticketfelder) ===================== */
const TICKET_RE = /\b(W[O0]|TAS|INC|REQ|RITM|SR|CRQ|CHG)[\s\-_]?(\d{5,15})\b/gi;
const PREFIX_ORDER = ['WO','TAS','INC','REQ','RITM','SR','CRQ','CHG'];
const POS = /termin|geplant|zeitfenster|\bzeit\b|uhr|beginn|\bstart|ankunft|vor ort|scheduled|appointment|einsatz|datum|\bam\b|\bum\b|\bvon\b/i;
const NEG = /erstellt|erstell|created|ge(ä|ae|a)ndert|modified|gemeldet|reported|gesendet|sent\b|empfangen|received|gedruckt|printed|letzte|last|\bsla\b|aktualisiert|updated|eröffnet|opened/i;
const MONTHS = {januar:1,jan:1,februar:2,feb:2,'märz':3,maerz:3,mrz:3,april:4,apr:4,mai:5,juni:6,jun:6,juli:7,jul:7,august:8,aug:8,september:9,sept:9,sep:9,oktober:10,okt:10,november:11,nov:11,dezember:12,dez:12};
const pad2 = n => String(n).padStart(2,'0');

function normPrefix(p){ p=p.toUpperCase(); return p==='W0'?'WO':p; }
function normTicket(p,d){ return normPrefix(p)+d; }

function normOcr(text){
  return String(text)
    .replace(/\b(INC|WO|W0|REQ|TAS|RITM|CRQ|CHG)\s?([0-9OoIl]{6,15})\b/g, (m,p,d) => p + d.replace(/[Oo]/g,'0').replace(/[Il]/g,'1'))
    .replace(/(^|[^\w])[oO](\d[:.]\d\d)\b/g, '$10$2')
    .replace(/\bF[l1I|]ex\b/g, 'Flex')
    .replace(/\bTechn[il1|!]ker\b/gi, 'Techniker');
}
function splitBlocks(text){
  text = normOcr(text);
  const bt = [...text.matchAll(/^.{0,6}\b(Betreff|Subject)\s*:/gim)].map(m => m.index);
  if(bt.length >= 2){
    const out = []; for(let i=0;i<bt.length;i++) out.push(text.slice(i ? bt[i] : 0, bt[i+1] ?? text.length));
    return out;
  }
  const re = new RegExp(TICKET_RE.source,'gi'); const byP = {}; let m;
  while((m = re.exec(text))){
    const p = normPrefix(m[1]), id = normTicket(m[1],m[2]);
    (byP[p] ||= new Map()); if(!byP[p].has(id)) byP[p].set(id, m.index);
  }
  let best = null;
  for(const p of PREFIX_ORDER){ if(byP[p] && (!best || byP[p].size > byP[best].size)) best = p; }
  if(!best || byP[best].size < 2) return [text];
  const cuts = [...byP[best].values()].sort((a,b)=>a-b).map(i => { const ls = text.lastIndexOf('\n', i); return ls < 0 ? 0 : ls+1; });
  cuts[0] = 0;
  const blocks = [];
  for(let i=0;i<cuts.length;i++) blocks.push(text.slice(cuts[i], cuts[i+1] ?? text.length));
  return blocks;
}

function labeled(lines, re, maxLen=120){
  for(let i=0;i<lines.length;i++){
    const m = lines[i].match(re);
    if(!m) continue;
    let v = lines[i].slice(m.index + m[0].length).replace(/^[\s:.\-–=]+/,'').trim();
    if(!v && lines[i+1] && lines[i+1].length <= maxLen) v = lines[i+1].trim();
    if(v) return { v, i };
  }
  return null;
}

function normPhone(s){
  let d = String(s||'').replace(/[^\d+]/g,'');
  if(d.startsWith('0041')) d = '+41'+d.slice(4);
  else if(d.startsWith('41') && d.length===11) d = '+'+d;
  else if(d.startsWith('0')) d = '+41'+d.slice(1);
  return d.replace(/^\+410/,'+41');
}
function fmtPhone(s){
  const d = normPhone(s);
  if(/^\+41\d{9}$/.test(d)) return ('0'+d.slice(3)).replace(/(\d{3})(\d{3})(\d{2})(\d{2})/,'$1 $2 $3 $4');
  return s;
}

function findTimes(lines){
  const out = [];
  const re = /(?<![\d.:])([01]?\d|2[0-3])[:.]([0-5]\d)(?![.:]?\d)(?:\s*(?:uhr|h)\b)?(?:\s*(?:-|–|—|bis|to)\s*([01]?\d|2[0-3])[:.]([0-5]\d)(?![.:]?\d))?/gi;
  lines.forEach((l,i) => {
    re.lastIndex = 0; let m;
    const prev = lines[i-1] || '';
    const prevLabel = prev.length < 32;
    while((m = re.exec(l))){
      let s = 1;
      if(POS.test(l) || (prevLabel && POS.test(prev))) s += 3;
      if(NEG.test(l) || (prevLabel && NEG.test(prev) && !POS.test(l))) s -= 6;
      if(m[0].includes(':')) s += 1;
      if(/uhr/i.test(m[0])) s += 1;
      if(m[3]) s += 2;
      if(+m[1] < 5 || +m[1] > 21) s -= 6;
      out.push({ s, i, start: pad2(m[1])+':'+m[2], end: m[3] ? pad2(m[3])+':'+m[4] : '' });
    }
  });
  return out.sort((a,b) => b.s - a.s || a.i - b.i);
}

function findDate(lines, timeLine){
  const out = [];
  const re1 = /(?<!\d)(\d{1,2})\.\s?(\d{1,2})\.\s?(20\d{2}|\d{2})(?!\d)/g;
  const re2 = /(?<!\d)(20\d{2})-(\d{2})-(\d{2})(?!\d)/g;
  const re3 = /(?<!\d)(\d{1,2})\.?\s+(januar|februar|märz|maerz|april|mai|juni|juli|august|september|oktober|november|dezember|jan|feb|mrz|apr|jun|jul|aug|sept?|okt|nov|dez)\.?\s+(20\d{2})/gi;
  lines.forEach((l,i) => {
    const prev = lines[i-1] || ''; const prevLabel = prev.length < 32;
    const score = () => {
      let s = 1;
      if(i === timeLine) s += 4;
      if(POS.test(l) || (prevLabel && POS.test(prev))) s += 3;
      if(NEG.test(l) || (prevLabel && NEG.test(prev) && !POS.test(l))) s -= 6;
      return s;
    };
    let m;
    re1.lastIndex = 0; while((m = re1.exec(l))){ let y = +m[3]; if(y < 100) y += 2000; out.push({ s:score(), y, mo:+m[2], d:+m[1] }); }
    re2.lastIndex = 0; while((m = re2.exec(l))){ out.push({ s:score(), y:+m[1], mo:+m[2], d:+m[3] }); }
    re3.lastIndex = 0; while((m = re3.exec(l))){ out.push({ s:score()+1, y:+m[3], mo:MONTHS[m[2].toLowerCase()]||0, d:+m[1] }); }
  });
  const ok = out.filter(c => c.mo>=1 && c.mo<=12 && c.d>=1 && c.d<=31 && c.s >= 3).sort((a,b)=>b.s-a.s);
  return ok.length ? `${ok[0].y}-${pad2(ok[0].mo)}-${pad2(ok[0].d)}` : '';
}

function parseBlock(raw, fallbackDate){
  const text = normOcr(String(raw).replace(/\r/g,'').replace(/[|¦]/g,' '));
  const lines = text.split('\n').map(l => l.replace(/\s+/g,' ').trim()).filter(Boolean);
  const t = { id:uid(), ticket:'', kind:'', title:'', date:fallbackDate, start:'', end:'', flex:false, dur:null,
              address:'', room:'', contact:'', phone:'', email:'', notes:'', devices:'', shelf:'', orderId:'', newDevice:'', oldDevice:'', material:'', free:false, raw:text.trim(), done:false };

  // Ticketnummer
  const nums = [...text.matchAll(new RegExp(TICKET_RE.source,'gi'))].map(m => ({ p:normPrefix(m[1]), id:normTicket(m[1],m[2]) }));
  for(const p of PREFIX_ORDER){ const f = nums.find(n => n.p === p); if(f){ t.ticket = f.id; break; } }

  // Flex / Fix: steht nirgends "Flex" → Fixtermin
  t.flex = /\bflex/i.test(text);

  // Zeit + Datum
  const times = findTimes(lines);
  let timeLine = -1;
  if(times.length && times[0].s >= 2){ t.start = times[0].start; t.end = times[0].end; timeLine = times[0].i; }
  const d = findDate(lines, timeLine);
  if(d) t.date = d;
  if(t.start && t.end){ const du = toMin(t.end) - toMin(t.start); if(du > 0) t.dur = du; }

  // E-Mail
  const em = text.match(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/); if(em) t.email = em[0];

  // Telefon: bevorzugt bei Kontakt/Tel-Label
  const phoneRe = /(?:(?:\+|00)\s?41|\b0)\s?\(?0?\)?\s?\d{2}[\s.\/-]?\d{3}[\s.\/-]?\d{2}[\s.\/-]?\d{2}\b/g;
  const phoneCands = [];
  lines.forEach((l,i) => { for(const m of l.matchAll(phoneRe)){ const ctx = l+' '+(lines[i-1]||''); let s = 0; if(/tel|telefon|mobile|natel|handy|phone|kontakt|ansprech/i.test(ctx)) s += 2; if(/fax/i.test(l)) s -= 5; phoneCands.push({ s, v:m[0] }); } });
  phoneCands.sort((a,b)=>b.s-a.s);
  if(phoneCands.length && phoneCands[0].s > -1) t.phone = fmtPhone(phoneCands[0].v);

  // Kontaktperson
  const c = labeled(lines, /^\W{0,3}(kontakt\s?person|kontakt|ansprech\s?(?:partner(?:in)?|person)|endbenutzer(?:in)?|benutzer(?:in)?|betroffene[r]?(?:\s?person)?|anwender(?:in)?|melder(?:in)?|requested for|contact|customer|user)\b\s*[:\-]?/i, 60);
  if(c){
    let v = c.v.replace(phoneRe,'').replace(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/,'')
               .replace(/\b(tel(?:efon)?|mobile|natel|handy|e-?mail|phone|fax)\b.*$/i,'')
               .replace(/[,;:\-–\s]+$/,'').trim();
    if(v && /[a-zäöü]/i.test(v)) t.contact = v.slice(0,60);
  }

  // Standort / Adresse
  const streetRe = /((?:[A-ZÄÖÜ][\wäöüéèàß.\-]*\s)?[A-ZÄÖÜ][\wäöüéèàß\-]*(?:strasse|str\.|gasse|weg|platz|quai|ring|allee|rain|steig|halde|matte|acker|hof|graben|berg|bühl|buehl|park|zelg))\s*(\d{1,4}\s?[a-zA-Z]?)\b/;
  const plzRe = /\b(8\d{3})\s+([A-ZÄÖÜ][a-zäöüéè]+(?:[ \-][A-ZÄÖÜa-zäöüé]+)?)/;
  let addr = '';
  const a = labeled(lines, /\b(standort|einsatzort|lieferadresse|adresse|liegenschaft|location|address|site)\b\s*[:\-]?/i, 80)
         || labeled(lines, /\b(ort|gebäude|gebaeude)\s*:/i, 80);
  if(a) addr = a.v.replace(/\b(raum|zimmer|büro|buero|stock(?:werk)?|etage|geschoss|tel(?:efon)?|kontakt)\b.*$/i,'').replace(/[,;\-–\s]+$/,'').trim();
  if(!addr || !/\d/.test(addr)){
    const s = text.match(streetRe);
    if(s) addr = (addr && !addr.includes(s[1]) ? addr+', ' : '') + s[1]+' '+s[2].replace(/\s/g,'');
  }
  const plz = text.match(plzRe);
  if(plz && !addr.includes(plz[1])) addr = (addr ? addr+', ' : '') + plz[1]+' '+plz[2];
  t.address = addr.slice(0,120);

  // Raum / Stockwerk
  const rooms = [];
  for(const m of text.matchAll(/\b(raum|zimmer|büro|buero|stock(?:werk)?|etage|geschoss|room|floor)\b\s*[:\-]?\s*([\w.\-\/]{1,12})/gi)){ rooms.push(m[1][0].toUpperCase()+m[1].slice(1).toLowerCase()+' '+m[2]); if(rooms.length>=2) break; }
  const og = text.match(/\b(\d{1,2}\.?\s?(?:OG|UG|Stock))\b/); if(og && !rooms.join(' ').includes(og[1])) rooms.push(og[1]);
  t.room = rooms.join(', ');

  // Art (IMACD)
  const k = text.match(/\b(install(?:ation)?|neuinstallation|move|umzug|add|change|dispose|entsorgung|rollout|austausch|ersatz|rückbau|rueckbau)\b/i);
  if(k) t.kind = k[1][0].toUpperCase()+k[1].slice(1).toLowerCase();

  // Titel
  const ti = labeled(lines, /\b(zusammenfassung|kurzbeschreibung|summary|titel|title|beschreibung|description|auftrag)\b\s*[:\-]?/i, 120)
          || labeled(lines, /\b(betreff|subject)\b\s*[:\-]?/i, 120);
  if(ti) t.title = ti.v;
  else {
    const cand = lines.find(l => l.length > 12 && /[a-zäöü]{4}/i.test(l) && !new RegExp(TICKET_RE.source,'i').test(l) && !/@|\d{2}[:.]\d{2}/.test(l) && !/^(von|an|cc|gesendet|from|to|sent)\b/i.test(l));
    if(cand) t.title = cand;
  }
  outlookEnhance(t, lines, text);
  t.title = t.title.slice(0,100);
  return t;
}

/* Outlook-Termin (Betreff / Beginn / Ende / Kategorien) – Format OIZ-SIBAP */
const OL_LABEL = /^\W{0,3}(betreff|subject|beginn|start|ende|end|serientyp|organisator|kategorien|categories|ort|location|standort|termin|erforderliche|optionale|teilnehmer|wichtigkeit)\b/i;
const KIND_RE = /\b(austausch|abbau|(?:rampen)?lieferung|install(?:ation)?|neuinstallation|move|umzug|z(?:ü|ue)geln|add|change|dispose|entsorgung|rollout|ersatz|r(?:ü|ue)ckbau|r(?:ü|ue)cknahme|abholen|ausliefern|staging|stagen)\b/i;
function outlookEnhance(t, lines, text){
  // Geräte (Computernamen der Stadt Zürich)
  const dev = [...new Set([...text.matchAll(/\bzrh[l1I][a-z0-9]{3,5}\b/gi)].map(m => m[0].toUpperCase().replace(/^ZRH[1I]/,'ZRHL')))];
  if(dev.length) t.devices = dev.join(', ');

  // Ticketnummer aus zerstückelter Texterkennung zusammensetzen (INC + 12 Ziffern)
  if(!t.ticket){
    const m = text.match(/[\\|I1l!]?NC\s?([0-9Oo]{3,12})/);
    if(m){
      let d = m[1].replace(/[Oo]/g,'0');
      if(d.length < 12){
        const after = text.slice(m.index + m[0].length, m.index + m[0].length + 200);
        const f = [...after.matchAll(/\b(\d{3,9})\b/g)].map(x => x[1]).find(x => d.length + x.length === 12);
        if(f) d += f;
      }
      if(d.length === 12) t.ticket = 'INC' + d;
    }
  }

  // Beginn / Ende: «Di 13.10.2026 09:00»
  const dtRe = /(\d{1,2})\.\s?(\d{1,2})\.\s?(20\d{2})\s+(\d{1,2})[:.](\d{2})/;
  const dts = [];
  lines.forEach((l,i) => { const m = l.match(dtRe); if(m) dts.push({ i, l, date:`${m[3]}-${pad2(m[2])}-${pad2(m[1])}`, time:pad2(m[4])+':'+m[5] }); });
  if(dts.length){
    const okT = d => { const h = +d.time.slice(0,2); return h >= 5 && h <= 21; };
    const valid = dts.filter(okT).length ? dts.filter(okT) : dts;
    const day = valid[0].date, same = valid.filter(d => d.date === day).sort((x,y) => toMin(x.time) - toMin(y.time));
    const b = same[0], e = same.length > 1 ? same[same.length-1] : null;
    t.date = b.date; t.start = b.time; t.end = e && e.date === b.date && toMin(e.time) > toMin(b.time) ? e.time : '';
    t.dur = t.end ? toMin(t.end) - toMin(t.start) : null;
  }

  // Betreff: alle Zeilen zwischen «Betreff» und «Beginn» (Outlook druckt «Ort:» mitten hinein)
  const bi = lines.findIndex(l => /^\W{0,6}\b(betreff|subject)\s*:?/i.test(l));
  let betreffTitle = '', betreff = '';
  if(bi >= 0){
    const stop = lines.findIndex((l,k) => k > bi && /^\W{0,3}(beginn|start|ende|serientyp|organisator|kategorien)\b/i.test(l));
    const end = stop > bi ? stop : Math.min(lines.length, bi + 5);
    const parts = [];
    for(let k = bi; k < end; k++){
      let l = lines[k].replace(/^.*?\b(betreff|subject)\s*:?\s*/i,'');
      const om = l.match(/^\W{0,3}(ort|location)\s*:\s*(.*)$/i);
      if(om){
        if(!/\s\/\s/.test(om[2])){ if(om[2].trim()) t.notes = (t.notes ? t.notes+'\n' : '') + 'Ort: ' + om[2].trim(); continue; }
        l = om[2];
      }
      l = l.replace(/^\s*am (vormittag|nachmittag|morgen|abend)\s*$/i, m => { t.notes = (t.notes ? t.notes+'\n' : '') + 'Zeitfenster: ' + m.trim(); return ''; });
      if(l.trim()) parts.push(l.trim());
    }
    betreff = parts.join(' ').replace(/\s+/g,' ').trim();
    const ortCut = betreff.match(/\s(?:[o0][rn]?t\s*:?\s*)?\b(?:a?m\s+)?(?:vormittag|nachmittag|morgen\b|abend\b)[^/]*$/i)
                || betreff.match(/\s[^/]*\b(?:melden|sekretariat|falls fragen)\b[^/]*$/i);
    if(ortCut){
      const o = ortCut[0].replace(/^\s*[o0][rn]?t\s*:?\s*/i,'').replace(/^m\s/i,'am ').trim();
      if(o) t.notes = (t.notes ? t.notes+'\n' : '') + 'Ort: ' + o;
      betreff = betreff.slice(0, ortCut.index).trim();
    }
    if(betreff) t.notes = 'Betreff: ' + betreff + (t.notes ? '\n'+t.notes : '');
    const segs = betreff.split(/\s\/\s|\s\/(?!\d)|(?<!\d)\/\s|\s--\s/).map(x => x.trim()).filter(Boolean);
    let inMat = false, gotAddr = false, gotRoom = false;
    for(let i = 0; i < segs.length; i++){
      const sg = segs[i], num = sg.replace(/[Oo]/g,'0').replace(/\s/g,'');
      const was = inMat; inMat = false;
      if(/kostenlos|ohne auftrag/i.test(sg)){ t.free = true; continue; }
      if(/^[\d\s,;+&]+$/.test(sg) && /\d{6}/.test(sg)){                                                                           // mehrere Aufträge
        const ids = sg.match(/\b\d{6}\b/g) || [], assets = sg.match(/\b\d{8,12}\b/g) || [];
        if(ids.length) t.orderId = [...new Set([...(t.orderId ? t.orderId.split(', ') : []), ...ids])].join(', ');
        if(assets.length) t.newDevice = [...new Set([...(t.newDevice ? t.newDevice.split(', ') : []), ...assets])].join(', ');
        continue;
      }                                                       // ohne Auftrags-ID
      if(/^[A-Z][0-9lI|T]{1,2}$/.test(sg) && !t.shelf){ t.shelf = sg[0] + sg.slice(1).replace(/[lI|T]/g,'1'); continue; }   // Regalplatz
      if(/^\d{6}$/.test(num) && !t.orderId){ t.orderId = num; continue; }                                                     // Auftrags-ID
      if(/^\d{8,12}$/.test(num) && !t.newDevice){ t.newDevice = num; continue; }                                               // Asset-ID
      if(/^zrh[l1I][a-z0-9]{3,5}$/i.test(sg) && !t.newDevice){ t.newDevice = sg.toUpperCase().replace(/^ZRH[1I]/,'ZRHL'); continue; } // Hostname
      if(new RegExp('^'+TICKET_RE.source+'$','i').test(sg)) continue;
      const od = sg.match(/^(austausch|abbau|r(?:ü|ue)ckbau|ersatz|entsorgung)\s*:?\s*(.+)$/i);
      if(od){
        let parts = od[2].replace(/\s\d{5,}\b/g,'').split(/\s*(?:=\s?>|-\s?>|→|»|=)\s*/);
        if(parts.length < 2){
          const BR = /\b(Lenovo|HP|Dell|Apple|Samsung|Logitech|Jabra|Fujitsu|Microsoft|Philips|Eizo|Poly|Yealink)\b/g;
          const hits = [...od[2].matchAll(BR)];
          if(hits.length >= 2 && hits[1][0] !== hits[0][0]) parts = [od[2].slice(0, hits[1].index), od[2].slice(hits[1].index)];
        }
        parts = parts.map(p => p.replace(/\bMonitor\s+[1lI]([23]\d[a-z]?-\d{2})\b/g, 'Monitor T$1'));
        t.oldDevice = parts[0].trim();
        if(parts[1]){ const q = parts[0].match(/^(\d+\s?x)\s/i); t.material = (q ? q[1].replace(/\s/,'') + ' ' : '') + parts[1].replace(/[;,.]\s*$/,'').trim(); }
        continue;
      }                                               // Altes Gerät
      if(/(strasse|str\.|gasse|weg|platz|quai|ring|allee|rain|hof|graben|bühl|buehl|matte|acker|halde|steig)\s*\d/i.test(sg)){
        if(!gotAddr){
          gotAddr = true;
          const am = sg.match(/(?:([A-ZÄÖÜ][a-zäöüéè]+)_)?([A-ZÄÖÜa-zäöü][\wäöüéè.\-]*?(?:strasse|str\.|gasse|weg|platz|quai|ring|allee|rain|hof|graben|bühl|buehl|matte|acker|halde|steig)\s*\d{1,4}(?:\/\d{1,4})?[a-z]?)/i);
          if(am) t.address = am[2] + (am[1] ? ', ' + am[1] : '');                                                            // «Zürich_Walchestrasse 31/33»
        }
        continue;
      }
      if(/^(etage|stock|büro|buero|raum|zimmer|loge|empfang|reception|lager|keller|\d+\.?\s?og)\b/i.test(sg)){ if(!gotRoom){ t.room = sg; gotRoom = true; } continue; }
      if(/^\d+\s?x\b/i.test(sg)){ t.material = sg; inMat = true; continue; }                                                  // «1x kabellose Maus»
      if(was && t.material){ t.material += ' / ' + sg; inMat = true; continue; }                                               // «… / Tastatur»
    }
    const km = betreff.match(new RegExp(KIND_RE.source + '\\s*:\\s*([^/]+)', 'i'));
    if(km) betreffTitle = (km[1][0].toUpperCase() + km[1].slice(1) + ': ' + km[2].replace(/\s\d{5,}\b/g,'')).replace(/\s*--\s*/g,' – ').trim();
    if(km && t.oldDevice && t.material) betreffTitle = km[1][0].toUpperCase() + km[1].slice(1) + ': ' + t.oldDevice + ' → ' + t.material.replace(/^\d+x\s/,'');
  }

  t.address = t.address.replace(/\bam (vormittag|nachmittag|morgen|abend)\b,?\s*/i,'').replace(/^[,\s]+/,'').trim();
  { const u = t.address.match(/^([A-ZÄÖÜ][a-zäöüéè]+)_(.+)$/); if(u) t.address = u[2] + ', ' + u[1]; }
  { const sm = t.address.match(/([A-ZÄÖÜ][\wäöüéè.\-]*?(?:strasse|str\.|gasse|weg|platz|quai|ring|allee|rain|hof|graben|bühl|buehl|matte|acker|halde|steig)\s*\d{1,4}(?:\/\d{1,4})?[a-z]?)((?:,?\s*8\d{3}\s+[A-ZÄÖÜ][a-zäöü]+)|(?:,\s*Zürich))?/);
    if(sm) t.address = sm[1] + (sm[2] ? (sm[2].startsWith(',') ? sm[2] : ', ' + sm[2].trim()) : ''); }
  t.room = t.room.split(/,\s*/).filter(r => !/\b(ja|nein|siehe)\b/i.test(r)).join(', ');

  // Kontaktperson: Name (evtl. mit Benutzerkürzel) direkt über einer Telefonnummer
  const nameRe = /^([A-ZÄÖÜ][a-zäöüéèàç'-]+(?:\s+[A-ZÄÖÜ][a-zäöüéèàç'-]+){1,2})(?:\s+([a-z][a-z0-9]{3,10}))?[\s.,:;]*$/;
  const phoneOnly = l => /^(?:t(?:el)?\.?:?\s*)?(?:\+|00)?[\d\s()\/.-]{9,}$/i.test(l.trim());
  const isName = l => { const m = l.match(nameRe); if(!m) return null;
    if(/^(bitte|client|auf|der|die|das|neue[rs]?|ger(ä|a)t|hallo|danke|termin|kein|nicht)$/i.test(m[1].split(/\s+/)[0])) return null;
    if(/\b(docking|station|monitor|notebook|laptop|tastatur|maus|headset|drucker|kontaktperson|kontakt|falls|notfall|fragen|lieferung|abholung|standort|etage|büro|buero|windows|software|hardware|zubehör|ladegerät|kabel)\b/i.test(m[1])) return null;
    if(m[2] && /\.\s*$/.test(l)) return null; return m; };
  const ki = lines.findIndex(l => /^\W{0,3}(kategorien|categories)\b/i.test(l));
  const from = ki >= 0 ? ki + 1 : 0;
  const emailOnly = l => /^[\w.+-]+@[\w-]+(\.[\w-]+)+$/.test(l.trim());
  const contacts = [];
  for(let k = from; k < lines.length - 1; k++){
    let line = lines[k], pre = '';
    const pc = line.match(/^(.{4,60}?):\s*([A-ZÄÖÜ].*)$/);
    if(pc && !isName(line) && isName(pc[2])){ pre = pc[1].trim(); line = pc[2]; }
    const m = isName(line); if(!m || /betriebspartner|service|desk/i.test(m[1])) continue;
    let j = k + 1, email = '', phones = [];
    while(lines[j] && (phoneOnly(lines[j]) || emailOnly(lines[j])) && j < k + 5){
      if(emailOnly(lines[j])){ if(!email) email = lines[j].trim(); }
      else if(phones.length < 3) phones.push(fmtPhone(lines[j].replace(/^t(?:el)?\.?:?\s*/i,'')));
      j++;
    }
    if(pre){
      t.notes = (t.notes ? t.notes+'\n' : '') + 'Kontakt: ' + pre;
      const ub = pre.match(/(?:nur )?bis\s*(\d{1,2})[:.](\d{2})/i); if(ub && !t.availUntil) t.availUntil = pad2(ub[1])+':'+ub[2];
    }
    if(!phones.length && !email && !pre) continue;
    contacts.push({ name: m[1] + (m[2] ? ' ('+m[2]+')' : ''), email, phones, line:k, lines:[...Array(j-k).keys()].map(x => x+k) });
    k = j - 1;
  }
  if(contacts.length){
    const c = contacts[0];
    t.contact = c.name; if(c.phones[0]) t.phone = c.phones[0]; if(c.email) t.email = c.email;
    if(c.phones.length > 1) t.notes = (t.notes ? t.notes+'\n' : '') + 'Weitere Nr.: ' + c.phones.slice(1).join(', ');
    for(const o of contacts.slice(1)) t.notes = (t.notes ? t.notes+'\n' : '') + 'Alternativ: ' + [o.name, ...o.phones, o.email].filter(Boolean).join(' · ');
  }
  const contactLines = new Set(contacts.flatMap(c => c.lines));

  // Auftrag: Textzeilen nach «Kategorien» (ohne Name/Telefon), bis zum Formular-Teil
  const task = [];
  if(ki >= 0){
    for(let k = ki + 1; k < lines.length && task.length < 3; k++){
      const l = lines[k];
      if(/bitte beschreiben|konnten sie|wie k(ö|o)nnen wir|haben sie f|^arbeitsauftrag/i.test(l)) break;
      if(contactLines.has(k) || /^(kontakt|oder|und)\s*:?$/i.test(l)) continue;
      if(phoneOnly(l) || (isName(l) && lines[k+1] && phoneOnly(lines[k+1]))) continue;
      const letters = (l.match(/[a-zäöü]/gi) || []).length;
      if(l.length >= 8 && letters / l.length > .45){
        const cut = l.split(/\s--\s/)[0];
        task.push(cut.replace(/\s+\S{1,2}$/,''));
        if(cut !== l) break;
      }
    }
  }
  if(task.length) t.notes = (t.notes ? t.notes+'\n' : '') + 'Auftrag: ' + task.join(' ');
  const map = lines.map(l => l.match(/^(\d{6})\s*[–—-]\s*([a-z][a-z0-9]{3,10})\s*$/i)).filter(Boolean);
  if(map.length) t.notes += (t.notes ? '\n' : '') + 'Benutzer: ' + map.map(m => m[1]+' → '+m[2]).join(', ');
  const ach = lines.findIndex(l => /^achtung\s*:/i.test(l));
  if(ach >= 0) t.notes += (t.notes ? '\n' : '') + lines[ach] + (lines[ach+1] && !/:/.test(lines[ach+1]) ? ' ' + lines[ach+1] : '');
  const be = text.match(/bestellempf(?:ä|ae|a)nger\s*:\s*([^\n]+)/i);
  if(be) t.notes += (t.notes ? '\n' : '') + 'Für: ' + be[1].trim();

  // Titel: Auftragsart aus dem Betreff, sonst Auftragszeile
  if(bi >= 0 || ki >= 0){
    if(betreffTitle) t.title = betreffTitle;
    else if(t.material) t.title = 'Lieferung: ' + t.material;
    else {
      const good = task.find(l => !/kontakt|notfall|fragen|telefon|erfassen|abgeholt|[!{}|]{1,}/i.test(l) && l.split(/\s+/).length >= 3 && (l.match(/[a-zäöü]/gi)||[]).length / l.length > .65);
      if(good) t.title = good;
    }
  }
  t.title = t.title.replace(/(\s+[^\w\s(]{1,2})+$/,'').replace(/\s+[A-Za-zÄÖÜäöü]$/,'').trim();
  if(t.title && (t.title.match(/[a-zäöü]/gi) || []).length / t.title.length < .4) t.title = t.material ? 'Lieferung: ' + t.material : '';
  const k2 = (t.title + ' ' + text).match(KIND_RE);
  if(k2){ const w = k2[1].toLowerCase(); t.kind = /^stag/.test(w) ? 'Staging' : /^z/.test(w) ? 'Umzug' : /lieferung/.test(w) ? 'Lieferung' : w[0].toUpperCase()+w.slice(1); }
  if(t.title.startsWith('Lieferung')) t.kind = 'Lieferung';
  if(!t.title) t.title = [t.kind, t.oldDevice || t.material || t.newDevice].filter(Boolean).join(': ') || 'Ticket';
}

/* Outlook-Kalender (.ics) → ein Textblock pro Termin */
function icsToBlocks(ics){
  const un = ics.replace(/\r?\n[ \t]/g,'');
  const evs = un.split(/BEGIN:VEVENT/i).slice(1).map(e => e.split(/END:VEVENT/i)[0]);
  const val = (e,k) => { const m = e.match(new RegExp('^'+k+'(?:;[^:\\n]*)?:(.*)$','im')); return m ? m[1].replace(/\\n/gi,'\n').replace(/\\([,;\\])/g,'$1').trim() : ''; };
  const dt = (e,k) => {
    const m = e.match(new RegExp('^'+k+'(;[^:\\n]*)?:(\\d{8})(?:T(\\d{2})(\\d{2})(\\d{2})(Z)?)?','im')); if(!m) return null;
    const y=+m[2].slice(0,4), mo=+m[2].slice(4,6), d=+m[2].slice(6,8);
    if(!m[3]) return { date:`${y}-${pad2(mo)}-${pad2(d)}`, time:'' };
    let D = m[6] ? new Date(Date.UTC(y,mo-1,d,+m[3],+m[4])) : new Date(y,mo-1,d,+m[3],+m[4]);
    return { date:iso(D), time:pad2(D.getHours())+':'+pad2(D.getMinutes()) };
  };
  return evs.map(e => {
    const s = dt(e,'DTSTART'), en = dt(e,'DTEND');
    const [y,mo,d] = (s ? s.date : '').split('-');
    const [ey,emo,ed] = (en ? en.date : '').split('-');
    return [
      'Betreff: '+val(e,'SUMMARY'),
      s ? `Beginn: ${d}.${mo}.${y} ${s.time}` : '',
      en && en.time ? `Ende: ${ed}.${emo}.${ey} ${en.time}` : '',
      val(e,'LOCATION') ? 'Standort: '+val(e,'LOCATION') : '',
      val(e,'CATEGORIES') ? 'Kategorien: '+val(e,'CATEGORIES').replace(/,/g,'; ') : '',
      val(e,'DESCRIPTION')
    ].filter(Boolean).join('\n');
  });
}
function textToBlocks(text){ return /BEGIN:VEVENT/i.test(text) ? icsToBlocks(text) : splitBlocks(text); }

/* Techniker-Filter: Block erwähnt andere Techniker, aber nicht meinen → überspringen */
const TECH_RE = /\btechniker(?:in)?\s*[:#\-]?\s*(\d{1,2})\b|\btech\.?\s*(\d{1,2})\b/gi;
function techNumbers(text){ return [...String(text).matchAll(TECH_RE)].map(m => +(m[1]||m[2])); }
function isForMe(text, myTech){
  if(!myTech) return true;
  const n = techNumbers(text);
  return !n.length || n.includes(+myTech);
}

/* ===================== HILFSFUNKTIONEN ===================== */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function iso(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function toMin(t){ if(!t) return null; const [h,m] = t.split(':').map(Number); return h*60+m; }
function fromMin(m){ m = Math.max(0, Math.round(m)); return pad2(Math.floor(m/60)%24)+':'+pad2(m%60); }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (s, el=document) => el.querySelector(s);
function fmtDateLong(isoStr){
  const [y,m,d] = isoStr.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('de-CH',{weekday:'long',day:'numeric',month:'long'});
}
function addDays(isoStr, n){ const [y,m,d] = isoStr.split('-').map(Number); return iso(new Date(y,m-1,d+n)); }
function nowMin(){ const n = new Date(); return n.getHours()*60+n.getMinutes(); }
function locKey(t){
  if(!t || !t.address) return '';
  const s = t.address.match(/^([^,\d]+?)\s*\d/); if(s) return s[1].toLowerCase().trim();
  const p = t.address.match(/\b8\d{3}\b/); return p ? p[0] : t.address.toLowerCase();
}
function warnings(t){
  const w = [];
  if(!t.flex && !t.start) w.push('Fixtermin ohne Uhrzeit – bitte Zeit eintragen oder auf Flex stellen.');
  if(t.availUntil && t.start && toMin(t.availUntil) <= toMin(t.start)) w.push(`Kontakt nur bis ${t.availUntil} vor Ort – Termin beginnt ${t.start}. Vorher anrufen!`);
  if(!t.ticket && !t.orderId) w.push('Keine Ticket- oder Auftragsnummer erkannt.');
  if(!t.address) w.push('Kein Standort erkannt.');
  return w;
}

/* ===================== PLANUNG ===================== */
function durOf(t){
  if(t.dur) return +t.dur;
  if(t.start && t.end){ const d = toMin(t.end)-toMin(t.start); if(d > 0) return d; }
  return +state.settings.dur || 45;
}
function plan(date){
  const S = state.settings;
  const all = state.tickets.filter(t => t.date === date);
  const fixed = all.filter(t => !t.flex && t.start).sort((a,b)=>toMin(a.start)-toMin(b.start));
  const notime = all.filter(t => !t.flex && !t.start);
  const doneFlex = all.filter(t => t.flex && t.done);
  const pool = all.filter(t => t.flex && !t.done).sort((a,b)=> (a.start||'99').localeCompare(b.start||'99') || locKey(a).localeCompare(locKey(b)));
  const travel = (a,b) => (!a || !b) ? 0 : (locKey(a) && locKey(a) === locKey(b)) ? 0 : (+S.travel || 0);
  const items = [];
  let cursor = toMin(S.dayStart), last = null;
  if(date === iso(new Date())) cursor = Math.max(cursor, Math.ceil(nowMin() / 5) * 5);
  const startCursor = cursor;

  function fill(limit, nextFixed){
    for(;;){
      let best = null, bestScore = Infinity;
      let bestSt = 0;
      for(const f of pool){
        const tr = travel(last, f), st0 = cursor + tr;
        let st = f.start ? Math.max(st0, toMin(f.start)) : st0;
        const trN = nextFixed ? travel(f, nextFixed) : 0;
        if(st + durOf(f) + trN > limit) st = st0;
        if(st + durOf(f) + trN > limit) continue;
        let score = tr + trN*0.5 + (st - st0)/3;
        if(f.start) score += Math.abs(toMin(f.start) - st)/6;
        if(score < bestScore){ best = f; bestScore = score; bestSt = st; }
      }
      if(!best) return;
      const tr = travel(last, best);
      if(bestSt - tr - cursor >= 10) items.push({ type:'free', start:cursor, end:bestSt - tr });
      if(tr) items.push({ type:'travel', start:bestSt - tr, end:bestSt });
      const st = bestSt;
      items.push({ type:'ticket', t:best, start:st, end:st+durOf(best) });
      cursor = st + durOf(best); last = best;
      pool.splice(pool.indexOf(best), 1);
    }
  }

  for(const fx of fixed){
    const fs = toMin(fx.start);
    if(fs + durOf(fx) <= startCursor){ items.push({ type:'ticket', t:fx, start:fs, end:fs+durOf(fx), past:true }); continue; }
    fill(fs, fx);
    const tr = travel(last, fx);
    const conflict = cursor + tr > fs;
    if(!conflict && fs - tr - cursor >= 10) items.push({ type:'free', start:cursor, end:fs-tr });
    if(tr) items.push({ type:'travel', start:Math.max(cursor, fs-tr), end:fs });
    items.push({ type:'ticket', t:fx, start:fs, end:fs+durOf(fx), conflict: conflict && last ? last : null });
    cursor = Math.max(cursor, fs + durOf(fx)); last = fx;
  }
  fill(toMin(S.dayEnd), null);
  items.sort((a,b) => a.start - b.start || (a.type === 'ticket' ? 1 : -1));
  return { items, overflow:pool, doneFlex, notime, fixed, total:all.length, done:all.filter(t=>t.done).length,
           nFix:all.filter(t=>!t.flex).length, nFlex:all.filter(t=>t.flex).length };
}

function mapsUrl(a){
  if(!/\b\d{4}\b|zürich|zuerich/i.test(a)) a += ', Zürich';
  const q = encodeURIComponent(a);
  if(state.settings.nav === 'apple') return 'https://maps.apple.com/?daddr='+q+'&dirflg=d';
  return 'https://www.google.com/maps/dir/?api=1&destination='+q+'&travelmode=driving&dir_action=navigate';
}
function telUrl(p){ return 'tel:'+normPhone(p); }
function dObj(d){ const [y,m,dd] = d.split('-').map(Number); return new Date(y,m-1,dd); }
function relDay(d){
  const t = iso(new Date());
  if(d === t) return 'Heute';
  if(d === addDays(t,1)) return 'Morgen';
  if(d === addDays(t,-1)) return 'Gestern';
  return dObj(d).toLocaleDateString('de-CH',{ weekday:'long' });
}
function longDate(d){ return dObj(d).toLocaleDateString('de-CH',{ weekday:'long', day:'numeric', month:'long' }); }
function eyebrowDate(d){
  const o = dObj(d), rel = ['Heute','Morgen','Gestern'].includes(relDay(d));
  return o.toLocaleDateString('de-CH', rel ? { weekday:'long', day:'numeric', month:'long' } : { day:'numeric', month:'long', year:'numeric' });
}
function weekStart(d){ const o = dObj(d); return addDays(d, -((o.getDay()+6)%7)); }
function fmtDur(min){ return min < 60 ? `${min} Min.` : `${Math.floor(min/60)} Std.${min%60 ? ' '+(min%60)+' Min.' : ''}`; }
function pills(t){
  return `<span class="pill ${t.flex?'teal':'orange'}">${t.flex?'Flex':'Fix'}</span>`
       + (t.kind ? `<span class="pill">${esc(t.kind)}</span>` : '')
       + (t.shelf ? `<span class="pill blue">Regal ${esc(t.shelf)}</span>` : '')
       + (t.free ? `<span class="pill green">Kostenlos</span>` : '')
       + (t.done ? `<span class="pill green">Erledigt</span>` : '');
}
function rawBlock(raw){ return `<details class="raw"><summary>Erkannter Originaltext</summary><pre>${esc(raw)}</pre></details>`; }
function iconRow(icon, color, text, act, extra=''){
  return `<div class="row ic tap" data-act="${act}" ${extra}><span class="sq" style="--c:var(--${color})">${ICON[icon]}</span><span class="k">${text}</span><span class="chev">${ICON.chev}</span></div>`;
}

/* ---------- Wochenleiste ---------- */
function renderWeek(){
  const ws = weekStart(view.date), today = iso(new Date());
  const names = ['Mo','Di','Mi','Do','Fr','Sa','So'];
  let h = `<button class="wk-nav" data-act="weekPrev" aria-label="Vorherige Woche">${ICON.chevl}</button><div class="wk-days">`;
  for(let i=0;i<7;i++){
    const d = addDays(ws, i);
    const list = state.tickets.filter(t => t.date === d && !t.done);
    const dot = list.length ? (list.some(t => !t.flex) ? 'fix' : 'flex') : '';
    h += `<button class="wd ${d===view.date?'sel':''} ${d===today?'today':''}" data-act="pickDay" data-d="${d}">
      <span class="wdn">${names[i]}</span><span class="wdd">${dObj(d).getDate()}</span><span class="wdot ${dot}"></span></button>`;
  }
  $('#week').innerHTML = h + `</div><button class="wk-nav" data-act="weekNext" aria-label="Nächste Woche">${ICON.chev}</button>`;
}

/* ---------- Tagesplan ---------- */
function tlRow(t, start, end, opt={}){
  return `<div class="tl-row ${t.done?'done':''}">
    <div class="tl-time">${start!=null ? `<b>${fromMin(start)}</b><span>${fromMin(end)}</span>` : `<b>–</b>`}</div>
    <div class="tl-card ${t.flex?'flex':'fix'} ${opt.now?'now':''}" data-act="detail" data-id="${t.id}">
      <button class="chk ${t.done?'on':''}" data-act="done" data-id="${t.id}" aria-label="Als erledigt markieren">${ICON.check}</button>
      <div class="tl-body">
        <div class="tl-top">${pills(t)}${t.ticket||t.orderId?`<span class="tno">${esc(t.ticket || 'Auftrag '+t.orderId)}</span>`:''}</div>
        <div class="tl-title">${esc(t.title || 'Ohne Titel')}</div>
        ${t.address?`<div class="tl-sub">${ICON.pin}<span>${esc(t.address)}${t.room?' · '+esc(t.room):''}</span></div>`:''}
        ${t.contact?`<div class="tl-sub">${ICON.person}<span>${esc(t.contact)}</span></div>`:''}
        ${opt.conflict?`<div class="tl-warn">Zeit knapp – vorheriges Ticket endet zu spät</div>`:''}
        ${t.availUntil && t.start && toMin(t.availUntil) <= toMin(t.start) && !t.done ? `<div class="tl-warn">Kontakt nur bis ${esc(t.availUntil)} vor Ort – vorher anrufen</div>`:''}
      </div>
      <span class="chev">${ICON.chev}</span>
    </div>
  </div>`;
}

function renderPlan(){
  const isToday = view.date === iso(new Date());
  $('#planTitle').textContent = relDay(view.date);
  $('#planEyebrow').textContent = eyebrowDate(view.date);
  $('#dayInput').value = view.date;
  $('#todayBtn').hidden = isToday;
  renderWeek();

  const P = plan(view.date), nm = nowMin();
  let h = '';

  // Hinweise
  const pend = state.pending.length;
  const lb = state.lastBackup ? (Date.now() - new Date(state.lastBackup).getTime())/864e5 : Infinity;
  const notes = [];
  if(pend) notes.push(iconRow('tray','blue',`${pend} ${pend===1?'Ticket wartet':'Tickets warten'} auf Prüfung`,'goScan'));
  if(state.tickets.length && lb > 7) notes.push(iconRow('upload','orange', state.lastBackup ? 'Backup ist älter als 7 Tage' : 'Noch kein Backup erstellt','backup'));
  if(notes.length) h += `<div class="group" style="margin-bottom:14px">${notes.join('')}</div>`;

  if(!P.total){
    h += `<div class="empty"><img class="elogo" src="${LOGO}" alt=""><h3>Keine Tickets</h3>
      <p>Fotografiere deine Ticketblätter oder füge die Dispo-Mail ein.</p>
      <button class="btn-fill" data-act="goScan">${ICON.scan}Tickets erfassen</button></div>`;
    $('#planBody').innerHTML = h; return;
  }

  // Übersicht
  const pct = Math.round(P.done / P.total * 100);
  h += `<div class="card"><div class="sum-row">
      <div><span class="sum-n" style="color:var(--orange)">${P.nFix}</span><span class="sum-l">Fix</span></div>
      <div><span class="sum-n" style="color:var(--teal)">${P.nFlex}</span><span class="sum-l">Flex</span></div>
      <div><span class="sum-n" style="color:var(--green)">${P.done}/${P.total}</span><span class="sum-l">Erledigt</span></div>
    </div><div class="pbar"><div style="width:${pct}%"></div></div></div>`;

  // Nächster Fixtermin
  if(P.fixed.length){
    const nxt = P.fixed.find(f => !f.done && (!isToday || toMin(f.start) + durOf(f) > nm));
    if(nxt){
      let cd = '';
      if(isToday){ const diff = toMin(nxt.start) - nm; cd = diff <= 0 ? 'läuft jetzt' : 'in ' + fmtDur(diff); }
      h += `<div class="hero" data-act="detail" data-id="${nxt.id}">
        <div class="hl">Nächster Fixtermin${cd?`<span class="cdpill">${cd}</span>`:''}</div>
        <div class="ht">${esc(nxt.start)}${nxt.end?`<small> – ${esc(nxt.end)}</small>`:''}</div>
        <div class="htitle">${esc(nxt.title || 'Fixtermin')}</div>
        ${nxt.ticket?`<div class="hs">${esc(nxt.ticket)}</div>`:''}
        ${nxt.address?`<div class="tl-sub">${ICON.pin}<span>${esc(nxt.address)}${nxt.room?' · '+esc(nxt.room):''}</span></div>`:''}
        ${nxt.contact||nxt.phone?`<div class="tl-sub">${ICON.person}<span>${esc([nxt.contact,nxt.phone].filter(Boolean).join(' · '))}</span></div>`:''}
        ${nxt.availUntil && toMin(nxt.availUntil) <= toMin(nxt.start) ? `<div class="tl-warn">Kontakt nur bis ${esc(nxt.availUntil)} vor Ort – vorher anrufen</div>`:''}
        <div class="hacts">
          ${nxt.phone?`<a class="btn-tint" style="--c:var(--green)" href="${telUrl(nxt.phone)}">${ICON.phone}Anrufen</a>`:`<span class="btn-tint dis">${ICON.phone}Anrufen</span>`}
          ${nxt.address?`<a class="btn-tint" href="${mapsUrl(nxt.address)}" target="_blank" rel="noopener">${ICON.nav}Route</a>`:`<span class="btn-tint dis">${ICON.nav}Route</span>`}
        </div>
      </div>`;
    } else {
      const open = P.fixed.filter(f => !f.done).length;
      h += open
        ? `<div class="card allok"><span class="sq" style="--c:var(--orange)">${ICON.clock}</span>Keine weiteren Fixtermine · ${open} noch nicht abgehakt</div>`
        : `<div class="card allok"><span class="sq" style="--c:var(--green)">${ICON.check}</span>Alle Fixtermine erledigt</div>`;
    }
    h += `<div class="glabel">Fixtermine</div><div class="group">` + P.fixed.map(f => `
      <div class="row tap ${f.done?'done':''}" data-act="detail" data-id="${f.id}">
        <div class="fxt">${esc(f.start)}</div>
        <div class="k"><div class="fx1 ellip">${esc(f.contact || f.title || f.ticket || 'Fixtermin')}</div>
          <div class="fx2 ellip">${esc([f.ticket, f.address].filter(Boolean).join(' · ') || 'Standort fehlt')}</div></div>
        ${f.phone?`<a class="callbtn" href="${telUrl(f.phone)}" aria-label="Anrufen">${ICON.phone}</a>`:''}
      </div>`).join('') + `</div>`;
  }

  // Material aus dem Lager
  const mat = state.tickets.filter(t => t.date === view.date && t.shelf).sort((a,b) => a.shelf.localeCompare(b.shelf, 'de', { numeric:true }));
  if(mat.length){
    h += `<div class="glabel">Aus dem Lager holen</div><div class="group">` + mat.map(t => `
      <div class="row tap ${t.done?'done':''}" data-act="detail" data-id="${t.id}">
        <div class="fxt" style="color:var(--blue)">${esc(t.shelf)}</div>
        <div class="k"><div class="fx1 ellip">${esc(t.newDevice || t.material || t.title || 'Gerät')}</div>
          <div class="fx2 ellip">${esc([t.orderId ? 'Auftrag '+t.orderId : (t.free ? 'Kostenlos' : ''), t.ticket].filter(Boolean).join(' · '))}</div></div>
        <span class="chev">${ICON.chev}</span>
      </div>`).join('') + `</div>`;
  }

  // Tagesablauf
  h += `<div class="glabel">Tagesablauf${isToday && nm > toMin(state.settings.dayStart) ? ' · ab jetzt geplant' : ''}</div>`;
  for(const it of P.items){
    if(it.type === 'ticket'){
      const now = isToday && nm >= it.start && nm < it.end && !it.t.done;
      h += tlRow(it.t, it.start, it.end, { now, conflict:!!it.conflict });
    } else if(it.type === 'travel'){
      h += `<div class="tl-gap">${ICON.car}ca. ${fmtDur(it.end-it.start)} Weg</div>`;
    } else if(it.type === 'free'){
      h += `<div class="tl-gap">${ICON.clock}Frei ${fromMin(it.start)}–${fromMin(it.end)} · ${fmtDur(it.end-it.start)}</div>`;
    }
  }
  if(P.doneFlex.length){
    h += `<div class="glabel">Erledigt (Flex)</div>`;
    P.doneFlex.forEach(t => h += tlRow(t, null, null));
  }
  if(P.notime.length){
    h += `<div class="glabel">Fix, Uhrzeit fehlt</div>`;
    P.notime.forEach(t => h += tlRow(t, null, null));
  }
  if(P.overflow.length){
    h += `<div class="glabel">Passt nicht mehr in den Tag</div>`;
    P.overflow.forEach(t => h += tlRow(t, null, null));
  }
  h += `<div class="group" style="margin-top:24px">
    ${iconRow('copy','indigo','Tagesplan kopieren','copyDay')}
    ${iconRow('calplus','red','Zum Kalender hinzufügen','ics')}
  </div>`;
  $('#planBody').innerHTML = h;
}

function renderScan(){
  const dot = $('#pendDot');
  dot.hidden = !state.pending.length; dot.textContent = state.pending.length;

  if(+state.settings.tech > 3) state.settings.tech = '';
  const tech = state.settings.tech || '';
  $('#techSeg').innerHTML = [['','Alle'],['1','Techniker 1'],['2','Techniker 2'],['3','Techniker 3']]
    .map(([v,l]) => `<button class="${tech===v?'on':''}" data-act="tech" data-v="${v}">${l}</button>`).join('');
  const pm = $('#photoMode').value;
  $('#pmSeg').innerHTML = [['one','Einzeln'],['merge','Zusammen']]
    .map(([v,l]) => `<button class="${pm===v?'on':''}" data-act="pmode" data-v="${v}">${l}</button>`).join('');

  $('#previewWarn').hidden = !inPreview;
  $('#scanFoot').innerHTML = aiReady()
    ? (state.settings.aiProvider === 'claude' ? 'KI-Erkennung mit Claude ist aktiv.<br>Fotos werden zur Auswertung an Anthropic gesendet.' : 'KI-Erkennung mit Gemini ist aktiv.<br>Fotos werden zur Auswertung an Google gesendet.')
    : 'Die Texterkennung läuft direkt auf dem iPhone.<br>Es wird nichts hochgeladen.';
  const el = $('#pendingList');
  if(!state.pending.length){ el.innerHTML = ''; return; }
  let h = `<div class="glabel">Zu prüfen · ${state.pending.length}<button class="txtbtn bold" data-act="acceptAll">Alle übernehmen</button></div>`;
  for(const t of state.pending){
    const dup = (t.ticket || t.orderId) && state.tickets.some(x => (x.ticket || x.orderId) === (t.ticket || t.orderId) && x.date === t.date);
    const W = warnings(t);

    h += `<div class="pcard ${t.flex?'flex':'fix'}">
      <div class="pc-head">${pills(t)}${t.ticket?`<span class="tno">${esc(t.ticket)}</span>`:''}
        <span class="pc-when">${t.start?esc(t.start)+(t.end?'–'+esc(t.end):''):(t.flex?'flexibel':'Zeit fehlt')} · ${dd}</span></div>
      <div class="tl-title">${esc(t.title || 'Ohne Titel')}</div>
      ${t.address?`<div class="tl-sub">${ICON.pin}<span>${esc(t.address)}${t.room?' · '+esc(t.room):''}</span></div>`:''}
      ${t.contact||t.phone?`<div class="tl-sub">${ICON.person}<span>${esc([t.contact,t.phone].filter(Boolean).join(' · '))}</span></div>`:''}
      ${dup?`<div class="pc-note">Bereits vorhanden – wird beim Übernehmen aktualisiert.</div>`:''}
      ${W.length?`<div class="warn">${ICON.warn}<div>${W.map(esc).join('<br>')}</div></div>`:''}
      <div class="pc-acts">
        <button class="btn-fill" data-act="accept" data-id="${t.id}">Übernehmen</button>
        <button class="btn-tint" data-act="editPending" data-id="${t.id}">Bearbeiten</button>
        <button class="btn-tint" style="--c:var(--red)" data-act="discard" data-id="${t.id}" aria-label="Verwerfen">${ICON.trash}</button>

  el.innerHTML = h;
}

function setTab(tab){
  view.tab = tab;
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  ['plan','scan','data'].forEach(t => $('#tab-'+t).hidden = t !== tab);
  if(tab === 'plan') renderPlan();
  if(tab === 'scan') $('#scanDate').value = view.date;
  renderScan();
  if(tab === 'data') renderData();
  window.scrollTo(0,0);
}

/* ---------- Bottom-Sheet ---------- */
let sheetMode = null;
function showSheet(html, mode){
  const w = $('#sheetWrap'), sh = $('#sheet');
  sh.innerHTML = html; sheetMode = mode;
  if(!w.classList.contains('open')){
    w.style.display = 'block'; sh.scrollTop = 0;
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(() => requestAnimationFrame(() => w.classList.add('open')));
  } else sh.scrollTop = 0;
}
function closeSheet(){
  const w = $('#sheetWrap');
  w.classList.remove('open'); document.body.style.overflow = '';
  sheetMode = null; editing = null;
  setTimeout(() => { if(!w.classList.contains('open')) w.style.display = 'none'; }, 340);
}

function saveEdit(){
  if(!editing) return;
  const { t, mode } = editing;
  const v = id => $('#'+id).value.trim();
  Object.assign(t, {
    ticket: v('fTicket').toUpperCase(), date: v('fDate') || view.date, flex: $('#fFlex').checked,
    start: v('fStart'), end: v('fEnd'), dur: v('fDur') ? Math.max(5, +v('fDur')) : null,
    title: v('fTitle'), kind: v('fKind'), address: v('fAddr'), room: v('fRoom'),
    orderId: v('fOrder'), material: v('fMat'), free: t.free && !v('fOrder'), shelf: v('fShelf').toUpperCase(), newDevice: v('fNew').toUpperCase(), oldDevice: v('fOld'), contact: v('fContact'), phone: v('fPhone') ? fmtPhone(v('fPhone')) : '', email: v('fEmail'), notes: $('#fNotes').value.trim()
  });
  if($('#fDone')) t.done = $('#fDone').checked;
  if(mode === 'new') state.tickets.push(t);
  save();
  if(mode === 'new' && t.date !== view.date) view.date = t.date;
  renderAll(); toast('Gespeichert');
  if(mode === 'pending') closeSheet(); else openDetail(t.id);
}
function deleteEdit(){
  if(!editing) return;
  const { t, mode } = editing;
  if(mode === 'pending'){ state.pending = state.pending.filter(x => x.id !== t.id); }
  else { if(!confirm('Ticket löschen?')) return; state.tickets = state.tickets.filter(x => x.id !== t.id); }
  save(); closeSheet(); renderAll();
}

  t.done = !t.done; save(); renderPlan();

  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), msg.length > 60 ? 5500 : 2600);

function acceptOne(id){
  const p = state.pending.find(x => x.id === id); if(!p) return;
  const key = x => x.ticket || x.orderId;
  const ex = key(p) && state.tickets.find(x => key(x) === key(p) && x.date === p.date);
  if(ex) Object.assign(ex, { ...p, id:ex.id, done:ex.done, notes: ex.notes || p.notes });
  else state.tickets.push(p);
  state.pending = state.pending.filter(x => x.id !== id);
}

/* ===================== KI-ERKENNUNG (Claude) ===================== */
const AI_PROMPT = `Du liest Arbeitstickets eines IT-Technikers der Stadt Zürich (meist ausgedruckte Outlook-Termine «OIZ-SIBAP Betriebspartner», manchmal Mails oder Helix-Tickets). Erkenne ALLE Tickets und antworte NUR mit JSON, ohne weiteren Text:
{"tickets":[{"ticket":"","title":"","kind":"","date":"YYYY-MM-DD","start":"HH:MM","end":"HH:MM","flex":false,"technician":null,"address":"","room":"","devices":[],"shelf":"","orderId":"","free":false,"material":"","availUntil":"","newDevice":"","oldDevice":"","contact":"","phone":"","email":"","task":"","notes":""}]}
Regeln:
- ticket: Ticketnummer exakt (z. B. INC000004215474, WO…, REQ…, RITM…).
- Der Betreff hat oft die Form «E1 / Nummer / Gerät / Ticketnummer / Strasse Nr / Etage Büro / Auftrag». title = der Auftragsteil, z. B. «Austausch: zrhlAFCB L16 G1 (POOL) – Standalone».
- kind: Austausch, Install, Move, Change, Staging, Rückbau usw. – sonst leer.
- date/start/end aus «Beginn» und «Ende».
- flex: true NUR wenn das Wort «Flex» vorkommt (meist bei «Kategorien»), sonst false.
- technician: Zahl aus «Techniker N» (z. B. 2), sonst null.
- address: Strasse und Nummer, mit PLZ/Ort falls vorhanden. room: Etage/Büro/Raum.
- Der Betreff besteht aus Teilen, getrennt durch «/». Die Reihenfolge kann wechseln – ordne jeden Teil nach seinem Muster zu:
  · shelf: Regalplatz der Ware, Buchstabe + Zahl am Anfang (z. B. «C1», «B2»). Bei Abbau fehlt er.
  · orderId: 6-stellige Auftrags-ID (z. B. 250880). Steht «KOSTENLOS ohne Auftrag», gibt es keine: orderId leer, free=true.
  · material: Lieferpositionen wie «1x kabellose Maus / Tastatur». Bei «Austausch: 2x HP E243i Monitor => Lenovo Monitor T24-40» ist oldDevice «2x HP E243i Monitor» und material «2x Lenovo Monitor T24-40».
  · Mehrere Aufträge wie «250955, 4200062895 + 250956, 4200063467»: orderId «250955, 250956», newDevice «4200062895, 4200063467».
- availUntil: steht z. B. «nur bis 10:00 Uhr vor Ort», dann «10:00», sonst leer.
  · newDevice: neues Gerät – Hostname (z. B. ZRHLAC52) ODER Asset-ID aus 8–12 Ziffern (z. B. 6200036652).
  · ticket: INC/WO/REQ-Nummer.
  · address und room: Strasse/Nr. sowie Etage/Büro.
  · oldDevice: altes Gerät nach «Austausch:» oder «Abbau:» (z. B. «zrhlAA58 L13 Yoga G5»).
- devices: alle Computernamen wie ZRHLAFCB (Grossbuchstaben).
- contact/phone/email: erste Kontaktperson (Name steht über E-Mail/Telefon). Weitere Kontaktpersonen in notes.
- Adressen wie «Zürich_Walchestrasse 31/33» als «Walchestrasse 31/33, Zürich». «Loge» ist ein Raum.
- task: der Auftrag in einem Satz (z. B. «Auf Grass Barbara aozbagr als POOL stagen»).
- notes: weitere wichtige Hinweise, kurz.
- Fehlt ein Wert: leerer String. Nichts erfinden.`;

function blobToB64(blob){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
}
async function imageToJpegB64(file){
  let bmp;
  try{ bmp = await createImageBitmap(file, { imageOrientation:'from-image' }); }
  catch(e){ bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const max = 1800, w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight, sc = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w*sc); c.height = Math.round(h*sc);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
  return blobToB64(blob);
}
const GEM_FALLBACK = ['gemini-3.6-flash','gemini-3.8-flash','gemini-3.5-flash-lite','gemini-3.1-flash-lite','gemini-3-flash-preview'];
async function aiExtractGemini(input){
  const S = state.settings;
  let part;
  if(typeof input === 'string') part = { text:'Ticket-Text:\n\n' + input };
  else if(input.type === 'application/pdf' || /\.pdf$/i.test(input.name)) part = { inline_data:{ mime_type:'application/pdf', data: await blobToB64(input) } };
  else part = { inline_data:{ mime_type:'image/jpeg', data: await imageToJpegB64(input) } };
  const models = [...new Set([(S.gemModel || DEFAULTS.gemModel).trim(), ...GEM_FALLBACK])];
  let lastErr = null;
  for(const model of models){
    for(let attempt = 0; attempt < 2; attempt++){
      setProg(progLabel + ' – KI liest (' + model + ') …', 0.3 + attempt * 0.2);
      let r, data;
      try{
        r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent', {
          method:'POST',
          headers:{ 'content-type':'application/json', 'x-goog-api-key':S.gemKey },
          body: JSON.stringify({ contents:[{ role:'user', parts:[part, { text:AI_PROMPT }] }], generationConfig:{ responseMimeType:'application/json', temperature:0 } })
        });
        data = await r.json().catch(() => ({}));
      }catch(e){ lastErr = new Error('Keine Verbindung zur KI'); await new Promise(z => setTimeout(z, 1200)); continue; }
      if(r.ok){
        const txt = ((data.candidates || [])[0]?.content?.parts || []).map(p => p.text || '').join('');
        const m = txt.match(/\{[\s\S]*\}/); if(!m){ lastErr = new Error('KI-Antwort nicht lesbar'); break; }
        const j = JSON.parse(m[0]);
        return Array.isArray(j.tickets) ? j.tickets : [];
      }
      const msg = data.error && data.error.message || ('HTTP '+r.status);
      if((r.status === 400 || r.status === 403) && /api key|permission|unauthori/i.test(msg)) throw new Error('API-Key ungültig');
      lastErr = new Error(r.status === 429 ? 'Gratis-Kontingent aufgebraucht' : r.status >= 500 || /demand|overload|unavailable/i.test(msg) ? 'KI gerade überlastet' : msg);
      if(r.status === 404 || r.status === 400) break;                         // Modell nicht verfügbar → nächstes
      if(r.status === 429) break;                                              // eigenes Kontingent pro Modell → nächstes
      await new Promise(z => setTimeout(z, 1500 * (attempt + 1)));             // überlastet → kurz warten, nochmals
    }
  }
  throw lastErr || new Error('KI nicht erreichbar');
}
async function aiExtract(input){
  const S = state.settings;
  if(S.aiProvider !== 'claude') return aiExtractGemini(input);
  let part;
  if(typeof input === 'string') part = { type:'text', text:'Ticket-Text:\n\n' + input };
  else if(input.type === 'application/pdf' || /\.pdf$/i.test(input.name)) part = { type:'document', source:{ type:'base64', media_type:'application/pdf', data: await blobToB64(input) } };
  else part = { type:'image', source:{ type:'base64', media_type:'image/jpeg', data: await imageToJpegB64(input) } };
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{ 'content-type':'application/json', 'x-api-key':S.aiKey, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
    body: JSON.stringify({ model:S.aiModel || DEFAULTS.aiModel, max_tokens:4000, messages:[{ role:'user', content:[part, { type:'text', text:AI_PROMPT }] }] })
  });
  const data = await r.json().catch(() => ({}));
  if(!r.ok){
    const msg = data.error && data.error.message || ('HTTP '+r.status);
    if(r.status === 401) throw new Error('API-Key ungültig');
    throw new Error(msg);
  }
  const txt = (data.content || []).filter(c => c.type === 'text').map(c => c.text).join('');
  const m = txt.match(/\{[\s\S]*\}/); if(!m) throw new Error('KI-Antwort nicht lesbar');
  const j = JSON.parse(m[0]);
  return Array.isArray(j.tickets) ? j.tickets : [];
}
function aiToTicket(o, fallbackDate){
  const str = v => (v == null ? '' : String(v)).trim();
  const hm = v => { const m = str(v).match(/^(\d{1,2})[:.](\d{2})/); return m ? pad2(m[1])+':'+m[2] : ''; };
  const t = { id:uid(), ticket:str(o.ticket).toUpperCase().replace(/\s/g,''), kind:str(o.kind), title:str(o.title || o.task),
    date: /^\d{4}-\d{2}-\d{2}$/.test(str(o.date)) ? str(o.date) : fallbackDate,
    start:hm(o.start), end:hm(o.end), flex: o.flex === true || /^(true|ja|yes)$/i.test(str(o.flex)), dur:null,
    address:str(o.address), room:str(o.room), contact:str(o.contact), phone: o.phone ? fmtPhone(str(o.phone)) : '',
    email:str(o.email), devices: (Array.isArray(o.devices) ? o.devices : str(o.devices).split(/[,;\s]+/)).map(d => str(d).toUpperCase()).filter(Boolean).join(', '),
    notes: [o.task && str(o.task) !== str(o.title) ? 'Auftrag: '+str(o.task) : '', str(o.notes)].filter(Boolean).join('\n'),
    shelf:str(o.shelf).toUpperCase(), orderId:str(o.orderId), material:str(o.material), free: o.free === true, availUntil: hm(o.availUntil), newDevice:str(o.newDevice).toUpperCase(), oldDevice:str(o.oldDevice),
    raw: 'Mit KI erkannt (' + (state.settings.aiProvider === 'claude' ? 'Claude' : 'Gemini') + ')', done:false, ai:true };
  if(t.start && t.end){ const d = toMin(t.end) - toMin(t.start); if(d > 0) t.dur = d; }
  return t;
}
function addAiTickets(list, date){
  const my = state.settings.tech; let n = 0;
  for(const o of list){
    const tn = parseInt(o.technician, 10);
    if(my && tn && tn !== +my){ lastSkipped++; continue; }
    state.pending.push(aiToTicket(o, date)); n++;
  }
  save(); renderScan(); return n;
}
const aiReady = () => state.settings.aiOn && (state.settings.aiProvider === 'claude' ? state.settings.aiKey : state.settings.gemKey);
